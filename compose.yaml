x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set the project database URL in Dokploy}
  VIBETOKEN_API_KEY: ${VIBETOKEN_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
  SESSION_SECRET: ${SESSION_SECRET:?Set a project-specific secret}
  DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
  APP_URL: ${APP_URL:?Set the public origin}
  GENERATION_DAILY_LIMIT: ${GENERATION_DAILY_LIMIT:-10}
  GENERATION_LIVE_PILOT_USER_ID: ${GENERATION_LIVE_PILOT_USER_ID:-}
  GENERATION_LIVE_PILOT_REQUEST_ID: ${GENERATION_LIVE_PILOT_REQUEST_ID:-}
  GENERATION_LIVE_PILOT_EXPIRES_AT: ${GENERATION_LIVE_PILOT_EXPIRES_AT:-}
  GENERATION_REVIEW_POLICY: ${GENERATION_REVIEW_POLICY:-manual-v1}
  GENERATION_MVP_AUTOMATION_ENABLED: ${GENERATION_MVP_AUTOMATION_ENABLED:-false}
  GENERATION_REVIEW_MAX_WAIT_SECONDS: ${GENERATION_REVIEW_MAX_WAIT_SECONDS:-300}
  GENERATION_REVIEW_MAX_ATTEMPTS: ${GENERATION_REVIEW_MAX_ATTEMPTS:-3}
  GENERATION_REVIEW_TIMEOUT_MS: ${GENERATION_REVIEW_TIMEOUT_MS:-10000}

# Only these existing merchant credentials are needed for server-side Prompt Sift.
# No store/product, checkout flags, or payment reconciliation access is inherited.
x-prompt-sift-environment: &prompt-sift-environment
  PANCAKE_LIVE_MERCHANT_ID: ${PANCAKE_LIVE_MERCHANT_ID:-}
  PANCAKE_LIVE_PRIVATE_KEY: ${PANCAKE_LIVE_PRIVATE_KEY:-}

# Server-only payment configuration; never merge this block into the generation worker.
x-billing-environment: &billing-environment
  BILLING_TEST_ENABLED: "false"
  BILLING_LIVE_ENABLED: ${BILLING_LIVE_ENABLED:-false}
  BILLING_LIVE_PREPARATION_ENABLED: ${BILLING_LIVE_PREPARATION_ENABLED:-false}
  BILLING_LIVE_PILOT_USER_ID: ${BILLING_LIVE_PILOT_USER_ID:-}
  BILLING_LIVE_PILOT_REQUEST_ID: ${BILLING_LIVE_PILOT_REQUEST_ID:-}
  BILLING_LIVE_PILOT_EXPIRES_AT: ${BILLING_LIVE_PILOT_EXPIRES_AT:-}
  BILLING_DEPLOYMENT_MODE: ${BILLING_DEPLOYMENT_MODE:-}
  BILLING_LIVE_APP_ORIGIN: ${BILLING_LIVE_APP_ORIGIN:-}
  PANCAKE_LIVE_MERCHANT_ID: ${PANCAKE_LIVE_MERCHANT_ID:-}
  PANCAKE_LIVE_STORE_ID: ${PANCAKE_LIVE_STORE_ID:-}
  PANCAKE_LIVE_PRODUCT_ID: ${PANCAKE_LIVE_PRODUCT_ID:-}
  PANCAKE_LIVE_PRIVATE_KEY: ${PANCAKE_LIVE_PRIVATE_KEY:-}
  PANCAKE_LIVE_PLATFORM_PUBLIC_KEY: ${PANCAKE_LIVE_PLATFORM_PUBLIC_KEY:-}

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      <<: [*app-environment, *billing-environment]
      # Server-side GA4 purchase events (web only). Empty = disabled.
      GA_API_SECRET: ${GA_API_SECRET:-}
      GA_MP_DEBUG: ${GA_MP_DEBUG:-}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: [*app-environment, *prompt-sift-environment]
    depends_on:
      db:
        condition: service_healthy
  billing-reconciliation:
    build:
      context: .
      target: worker
    command: ["node", "scripts/start.mjs", "node", "--import", "tsx", "scripts/billing-reconcile-worker.ts", "run"]
    restart: unless-stopped
    stop_grace_period: 8m
    environment:
      <<: *billing-environment
      DATABASE_URL: ${DATABASE_URL:?Set the project database URL in Dokploy}
      SESSION_SECRET: ${SESSION_SECRET:?Set a project-specific secret}
      APP_URL: ${APP_URL:?Set the public origin}
    depends_on:
      db:
        condition: service_healthy
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a project database user}
      POSTGRES_DB: ${POSTGRES_DB:?Set a project database name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a project database password}
    volumes:
      - video-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  video-db:
